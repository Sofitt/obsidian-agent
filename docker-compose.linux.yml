version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_NUM_CTX=2048
    runtime: nvidia
    deploy: {} # убираем default deploy behavior
    stdin_open: true
    tty: true
    volumes:
      - ${HOME:-/root}/.ollama:/root/.ollama

  agent-linux:
    build: .
    volumes:
      - ./vault:/app/vault:ro
      - ./chat_rooms:/app/chat_rooms
      - ./context:/app/context
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    stdin_open: true
    tty: true
    command: ["bun", "agent.cjs"]
