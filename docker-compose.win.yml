version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11435:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_NUM_CTX=2048
    runtime: nvidia
    stdin_open: true
    tty: true
    volumes:
      - C:/Users/YOU/.ollama:/root/.ollama # <-- укажи реальный путь

  agent-windows:
    build: .
    volumes:
      - C:/Users/YOU/Documents/Obsidian:/app/vault:ro # <-- укажи реальный путь
      - ./chat_rooms:/app/chat_rooms
      - ./context:/app/context
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    stdin_open: true
    tty: true
    command: ["bun", "agent.cjs"]
